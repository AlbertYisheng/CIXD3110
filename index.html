<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Albert Shelter</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Anonymous+Pro:wght@400;700&display=swap');
    @import url('https://fonts.googleapis.com/css2?family=Anta:wght@400;700&display=swap');

    body {
      margin: 0;
      font-family: 'Anonymous Pro', monospace;
      color: #00F0FF;
      position: relative;
      height: 100vh;
      overflow: hidden;
    }

    /* 背景视频 */
    .background-video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -2; /* 放在最底层 */
    }

    /* 标题样式 */
    .title {
      position: absolute;
      top: 50px;
      left: 80px;
      font-size: 64px;
      font-family: 'Anta', sans-serif;
      font-weight: 400;
      z-index: 2;
      text-shadow: 0 0 5px #00F0FF; /* 发光效果 */
    }

    /* 信息框容器 */
    .info-container {
      position: absolute;
      top: 160px;
      left: 50px;
      z-index: 2;
    }

    /* 信息框样式 */
    .info-box {
      position: relative;
      width: 340px;
      margin-bottom: 30px; /* 信息框之间的间距 */
      background: rgba(255, 255, 255, 0.25);
      box-shadow: 0px 4px 4px rgba(0, 0, 0, 0.25);
      border-radius: 19px;
      padding: 20px;
      transition: transform 0.3s ease, box-shadow 0.3s ease, color 0.3s ease; /* 添加放大动画效果 */
      border: 1px solid white; /* 添加白色描边 */
      color: #00F0FF;
      cursor: pointer;
    }

    /* 信息框悬停效果 */
    .info-box:hover {
      transform: scale(1.05); /* 鼠标悬停时放大 */
      box-shadow: 0px 6px 8px rgba(255, 255, 255, 0.5); /* 高亮阴影 */
      color: white; /* 鼠标悬停时字体颜色变为白色 */
    }

    .info-box h2 {
      font-size: 36px;
      font-weight: 400;
      margin: 0 0 10px;
      font-family: 'Anta', sans-serif;
    }

    .info-box p {
      font-size: 20px;
      font-style: italic;
      font-weight: 400;
      margin: 5px 0;
      line-height: 1.5;
    }

    /* 新增框的样式 */
    .info-box.clickable {
      position: absolute;
      top: 80px; /* 顶部位置 */
      right: 100px; /* 靠右放置 */
      width: 120px;
      height: 60px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* 点击跳转样式 */
    .info-box.clickable:hover {
      transform: scale(1.1); /* 鼠标悬停时放大 */
    }

    .info-box.clickable h2 {
      font-size: 24px;
      margin: 0;
      text-align: center;
    }

    /* 响应式调整 */
    @media (max-width: 768px) {
      .title {
        font-size: 48px;
      }
      .info-box {
        width: 90%;
        padding: 15px;
      }
      .info-box h2 {
        font-size: 28px;
      }
      .info-box p {
        font-size: 18px;
      }
    }
  </style>
</head>
<body>
  <!-- 背景视频 -->
  <video autoplay muted loop class="background-video">
    <source src="frost_punk_clip.mp4" type="video/mp4">
    Your browser does not support the video tag.
  </video>

  <!-- 标题 -->
  <div class="title">Albert Shelter</div>

  <!-- 信息框容器 -->
  <div class="info-container">
    <!-- 游戏信息框 -->
    <div class="info-box">
      <h2>Collected Games</h2>
      <p>Civilization 6</p>
      <p>Stellaris</p>
      <p>FrostPunk</p>
      <p>League of Legends</p>
      <p>Marvel Snap</p>
    </div>

    <!-- 电影信息框 -->
    <div class="info-box">
      <h2>Collected Movies</h2>
      <p>Interstellar</p>
      <p>Your Name</p>
      <p>Kung Fu Panda</p>
      <p>Inception</p>
      <p>Kung Fu Hustle</p>
    </div>
  </div>

  <!-- 新增信息框 -->
  <div class="info-box clickable" onclick="location.href='Page2.html'">
    <h2>Click to go Foundation</h2>
  </div>
</body>
</html>
