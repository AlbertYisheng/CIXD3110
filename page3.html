<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foundation VR</title>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Audiowide', sans-serif;
            background: black;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: black;
            background-image: linear-gradient(to right, rgba(255, 255, 255, 0.1) 1px, transparent 1px),
                              linear-gradient(to bottom, rgba(255, 255, 255, 0.1) 1px, transparent 1px);
            background-size: 20px 20px;
            z-index: -1;
        }

        .title {
            text-align: center;
            margin-bottom: 20px;
            font-size: 3rem;
        }

        .content {
            position: relative;
            max-width: 400px;
            width: 80%;
        }

        .content img {
            width: 100%;
            height: auto;
            transition: transform 0.2s ease;
            cursor: pointer;
        }

        .content img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="title">
        <p>Project</p>
        <p>Foundation VR</p>
    </div>
    <div class="content">
        <img src="concept art.png" alt="Foundation VR" onclick="window.location.href='https://foundationvr.cargo.site';">
    </div>
</body>
</html>
