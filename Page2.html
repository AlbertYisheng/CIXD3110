<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foundation VR</title>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Audiowide', sans-serif;
            background: black;
            overflow: hidden;
            height: 100vh;
        }

        .background {
            position: fixed;
            top: -150%;
            left: -150%;
            width: 400%;
            height: 400%;
            background: black;
            z-index: -1;
            transform: rotate(-30deg);
            display: flex;
            flex-wrap: wrap;
            justify-content: space-around;
            align-items: center;
            padding: 50px;
            animation: scrollDiagonal 30s linear infinite;
        }

        .background span {
            font-size: 20px;
            color: white;
            opacity: 0.5;
            text-transform: uppercase;
            letter-spacing: 2px;
            white-space: nowrap;
            margin: 20px;
            animation: fadeEffect 10s linear infinite;
        }

        @keyframes scrollDiagonal {
            from {
                transform: rotate(-30deg) translate(0, 0);
            }
            to {
                transform: rotate(-30deg) translate(-300px, 300px);
            }
        }

        @keyframes fadeEffect {
            0% {
                opacity: 0.1;
            }
            50% {
                opacity: 0.4;
            }
            100% {
                opacity: 0.1;
            }
        }

        .content {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .content img {
            max-width: 300px;
            transition: transform 0.2s ease;
            cursor: pointer;
        }

        .content img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="background">
        <!-- 自动生成足够多的文字 -->
        <script>
            for (let i = 0; i < 2000; i++) {
                document.write('<span>Project: Foundation VR</span>');
            }
        </script>
    </div>
    <div class="content">
        <img src="concept art.png" alt="Foundation VR" onclick="window.location.href='https://foundationvr.cargo.site';">
    </div>
</body>
</html>
