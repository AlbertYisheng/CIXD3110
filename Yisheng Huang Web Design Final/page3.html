<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Foundation VR</title>
    <link href="https://fonts.googleapis.com/css2?family=Audiowide&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            font-family: 'Audiowide', sans-serif;
            background: black;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .background {
            position: fixed;
            top: 0;
            left: 0;
            width: 200%;
            height: 200%;
            background-color: black;
            z-index: -1;
            overflow: hidden;
        }

        .background::before {
            content: "Project: Foundation VR ";
            position: absolute;
            width: 200%;
            height: 200%;
            color: white;
            font-size: 40px;
            text-transform: uppercase;
            letter-spacing: 2px;
            transform: rotate(-45deg);
            display: block;
            white-space: nowrap;
            line-height: 100px;
            overflow: hidden;
            background-repeat: repeat;
        }

        .content {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .content img {
            max-width: 300px;
            transition: transform 0.2s ease;
            cursor: pointer;
        }

        .content img:hover {
            transform: scale(1.05);
        }
    </style>
</head>
<body>
    <div class="background"></div>
    <div class="content">
        <img src="concept art.png" alt="Foundation VR" onclick="window.location.href='https://foundationvr.cargo.site';">
    </div>
</body>
</html>
